# better-resume edge config: SPA + API on one origin (D07).
# Mounted as /etc/nginx/conf.d/default.conf, so everything here is http-level context.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# `docker compose --scale api=2` gives the service name several A records. nginx only reads
# `server api:8000` at startup, so the proxy target is a *variable* and goes through Docker's
# embedded DNS: a scaled-up or restarted replica is picked up within `valid`.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resume PDFs and answer payloads are small; nginx must allow the upload cap.
    client_max_body_size 16m;

    # Container health check: nginx itself, independent of the API.
    location = /nginx-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Client-facing health check: proves the whole api hop through the proxy.
    location = /healthz {
        set $api_health http://api:8000;
        proxy_pass $api_health/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        # With a variable, nginx does not append the URI: pass the original one.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (speech transcription) needs both headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE and WS: no buffering, no idle timeout at the default 60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        try_files $uri /index.html;
    }
}
