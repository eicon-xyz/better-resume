    <rect x="40" y="112" width="150" height="28" rx="6" fill="url(#gategrad)" stroke="#d8d8dc"/>
    <text x="202" y="131" font-size="11.5" fill="#8a8a90">低饱和靛蓝渐变底（灰阶占位）</text>
    <text x="640" y="660" font-size="11.5" fill="#a8a8ae" text-anchor="middle">全屏门面：不出现页壳顶栏与内容容器，未登录时独占首屏</text>
    <rect x="0" y="800" width="1280" height="56" fill="#fbfbfc"/>
    <line x1="0" y1="800" x2="1280" y2="800" stroke="#e2e2e6" stroke-width="1"/>
    <text x="40" y="826" font-size="12" fill="#7a7a82" font-weight="bold">线框 · SH-03 · 登录门（首屏）（灰阶线框，等比例重构）</text>
    <text x="40" y="844" font-size="10.5" fill="#a8a8ae">依据 docs/tickets/p14-web-redesign/README.md §1.4 提案 · 视口 1280x800 · 图内均为占位标签，无真实个人信息</text>
