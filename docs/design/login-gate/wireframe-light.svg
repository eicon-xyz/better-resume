<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="856" viewBox="0 0 1280 856">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5d5e4"/><stop offset="1" stop-color="#f3f3f9"/>
    </linearGradient>
    <linearGradient id="gradstrong" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6b6cc"/><stop offset="1" stop-color="#e4e4ef"/>
    </linearGradient>
    <linearGradient id="gategrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7e7f1"/><stop offset="1" stop-color="#fbfbfd"/>
    </linearGradient>
  </defs>
  <g font-family="WenQuanYi Zen Hei">
    <rect x="0" y="0" width="1280" height="800" fill="url(#gategrad)"/>
    <rect x="300" y="246" width="680" height="118" rx="8" fill="none" stroke="#c8c8cc" stroke-dasharray="6 4"/>
    <text x="316" y="270" font-size="11.5" fill="#8a8a90">居中 hero</text>
    <text x="640" y="314" font-size="46" fill="#4a4a4a" text-anchor="middle" font-weight="bold">产品名（大字阶）</text>
    <text x="640" y="350" font-size="17" fill="#6f6f75" text-anchor="middle">一句话价值主张</text>
    <rect x="440" y="390" width="400" height="206" rx="16" fill="#ffffff" stroke="#dcdce4" stroke-width="1.5" opacity="0.78"/>
