    <rect x="468" y="432" width="344" height="9" rx="4" fill="#e6e6ea"/>
    <rect x="468" y="448" width="250" height="9" rx="4" fill="#e6e6ea"/>
    <rect x="468" y="476" width="344" height="42" rx="8" fill="none" stroke="#c4c4cc"/>
    <text x="486" y="502" font-size="13" fill="#9a9aa0">用户名输入</text>
    <rect x="712" y="532" width="100" height="36" rx="8" fill="url(#gradstrong)"/>
    <text x="762" y="555" font-size="13" fill="#ffffff" text-anchor="middle">进入</text>
    <text x="866" y="404" font-size="11.5" fill="#8a8a90">玻璃质感登录卡</text>
    <text x="866" y="422" font-size="10.5" fill="#a8a8ae">（半透明底 + 细边框）</text>
