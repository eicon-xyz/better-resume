    <text x="1240" y="844" font-size="10.5" fill="#a8a8ae" text-anchor="end">渲染件 wireframe-light.png</text>
    <rect x="0.5" y="0.5" width="1279" height="855" fill="none" stroke="#d8d8dc"/>
