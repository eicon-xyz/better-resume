[project]
name = "better-resume-api"
version = "0.1.0"
description = "better-resume API: AI mock-interview platform (M0 skeleton)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "edge-tts>=7.2.8",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=5.0.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/better_resume"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not docker and not real'"
markers = [
  "docker: needs the compose stack (excluded from the default unit run; run via verify.sh)",
  "real: needs real vendor credentials and costs money (never in CI; run via verify.sh --layer real)",
]
